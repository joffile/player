<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0c14">
<meta name="mobile-web-app-capable" content="yes">
<title>Мой плеер</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--fg:#fff;--mut:#bdb8cc;--accent:hsl(260 60% 78%);--on-accent:hsl(260 40% 12%);--surface:hsl(260 25% 8%);--surface2:hsl(260 22% 15%);--line:hsl(260 20% 24%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--surface);color:var(--fg);font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;transition:background .6s}
button{font:inherit;color:inherit}
textarea{user-select:text;-webkit-user-select:text}
#bg{position:fixed;inset:0;background:50%/cover no-repeat;filter:blur(40px) brightness(.35);transform:scale(1.25);opacity:0;transition:opacity .8s;z-index:0}
#bg.on{opacity:1}
.app{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.2px;text-align:center}
.top small{display:block;margin-top:2px;text-align:center;font-size:13px;color:var(--mut)}
.btn{width:52px;height:52px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:22px;background:var(--surface2);cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-radius .4s,background .4s,color .4s}
.btn:active,.play:active,.chip:active,.tab:active{transform:scale(.92)}
.btn.on,.chip.on{background:var(--accent);color:var(--on-accent)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:4px;margin-top:14px;padding:5px;border-radius:999px;background:var(--surface2)}
.tab{flex:1;height:42px;border:0;border-radius:999px;background:none;font-size:15px;font-weight:700;cursor:pointer;transition:background .35s,color .35s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.tab.on{background:var(--accent);color:var(--on-accent)}
.stage{position:relative;flex:1;min-height:0;margin-top:12px;border-radius:44px;background:var(--surface2);overflow:hidden;cursor:pointer}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.view canvas{position:absolute;inset:0;width:100%;height:100%}
.lyrics{position:absolute;inset:0;width:100%;height:100%;border:0;outline:none;resize:none;background:transparent;color:var(--fg);padding:26px 24px;font:inherit;font-size:18px;line-height:1.6;font-weight:500;cursor:text}
.lyrics::placeholder{color:var(--mut);opacity:.8}
.lyrics:disabled{opacity:.5}
.meta{text-align:center;margin-top:16px}
.title{font-size:26px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{margin-top:4px;font-size:15px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{margin-top:14px}
.times{display:flex;justify-content:space-between;margin-top:4px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(var(--accent),var(--accent)) 0/var(--p,0%) 100% no-repeat,var(--surface2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--surface)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:var(--surface2)}
input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--accent)}
.ctrl{display:flex;align-items:center;justify-content:space-between;margin:18px 0 20px}
.ctrl .btn{width:52px;height:52px;border-radius:20px}
.play{width:100px;height:100px;display:grid;place-items:center;padding:0;border:0;border-radius:40px;background:var(--accent);color:var(--on-accent);cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-radius .5s cubic-bezier(.34,1.56,.64,1)}
.play.playing{border-radius:50px}
.play .ic{width:40px;height:40px;fill:currentColor;stroke-width:1.6}
.row2{display:flex;align-items:center;gap:8px}
.row2 .btn{width:48px;height:48px;border-radius:18px}
.chip{height:48px;min-width:48px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;background:var(--surface2);font-size:15px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .4s,color .4s}
.chip .ic{width:18px;height:18px}
.vol{flex:1;min-width:0}
.dim{position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:480px;margin:0 auto;height:70vh;display:flex;flex-direction:column;padding:16px 14px calc(14px + env(safe-area-inset-bottom));background:var(--surface);border-radius:36px 36px 0 0;transform:translateY(105%);transition:transform .4s cubic-bezier(.34,1.3,.64,1)}
.sheet.open{transform:none}
.sh{display:flex;align-items:center;justify-content:space-between;padding:0 6px 14px}
.sh b{font-size:20px;font-weight:800}
.sh div{display:flex;gap:8px}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 10px 10px 16px;border-radius:26px;background:var(--surface2);cursor:pointer;transition:background .4s,color .4s}
.it.cur{background:var(--accent);color:var(--on-accent)}
.n{width:24px;flex:none;text-align:center;font-size:14px;font-weight:700;color:var(--mut)}
.it.cur .n{color:var(--on-accent)}
.nm{flex:1;min-width:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fv{width:16px;height:16px;color:var(--accent);flex:none}
.it.cur .fv{color:var(--on-accent)}
.rm{width:40px;height:40px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:14px;background:none;color:inherit;opacity:.7;cursor:pointer}
.rm .ic{width:18px;height:18px}
.hint{margin:40px 10px;text-align:center;font-size:15px;line-height:1.5;color:var(--mut)}
#toast{position:fixed;z-index:9;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-160%);max-width:88vw;padding:12px 20px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:700;transition:transform .4s cubic-bezier(.34,1.56,.64,1);text-align:center}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="bg"></div>

<div class="app">
  <div class="top">
    <button class="btn" id="add" data-icon="plus" aria-label="Добавить музыку"></button>
    <div><h1>Мой плеер</h1><small id="count">Пусто</small></div>
    <button class="btn" id="pic" data-icon="image" aria-label="Выбрать фон"></button>
  </div>

  <div class="tabs">
    <button class="tab" data-v="scene">Шаблон</button>
    <button class="tab on" data-v="ring">Визуализация</button>
    <button class="tab" data-v="text">Текст</button>
  </div>

  <div class="stage" id="stage">
    <div class="view" data-v="scene"><canvas id="scene"></canvas></div>
    <div class="view on" data-v="ring"><canvas id="ring"></canvas></div>
    <div class="view" data-v="text"><textarea class="lyrics" id="lyrics" placeholder="Сначала выберите трек"></textarea></div>
  </div>

  <div class="meta">
    <div class="title" id="title">Выберите трек</div>
    <div class="artist" id="artist">Нажмите + и выберите музыку</div>
  </div>

  <div class="seek">
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>

  <div class="ctrl">
    <button class="btn" id="shf" data-icon="shuffle" aria-label="Перемешать"></button>
    <button class="btn" id="prev" data-icon="prev" aria-label="Назад"></button>
    <button class="play" id="play" aria-label="Играть"></button>
    <button class="btn" id="next" data-icon="next" aria-label="Далее"></button>
    <button class="btn" id="rep" aria-label="Повтор"></button>
  </div>

  <div class="row2">
    <button class="chip" id="spd">1×</button>
    <button class="chip" id="tmr" aria-label="Таймер сна"></button>
    <input type="range" class="vol" id="vol" min="0" max="100" value="80" aria-label="Громкость">
    <button class="btn" id="fav" data-icon="heart" aria-label="Избранное"></button>
    <button class="btn" id="lst" data-icon="list" aria-label="Плейлист"></button>
  </div>
</div>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet">
  <div class="sh"><b>Плейлист</b>
    <div>
      <button class="btn" id="clr" data-icon="trash" aria-label="Очистить"></button>
      <button class="btn" id="close" data-icon="down" aria-label="Закрыть"></button>
    </div>
  </div>
  <div id="list"></div>
</div>

<input type="file" id="file" accept="audio/*" multiple hidden>
<input type="file" id="imgf" accept="image/*" hidden>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const SP=[1,1.25,1.5,2,.75], TM=[0,15,30,60];
const I={
 plus:'<path d="M12 5.5v13M5.5 12h13"/>',
 play:'<path d="M7.5 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9 4.74a1 1 0 0 0-1.5.86z"/>',
 pause:'<rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/>',
 prev:'<path d="M6 5.5v13"/><path d="M18 6.3v11.4a.8.8 0 0 1-1.25.66l-8.2-5.7a.8.8 0 0 1 0-1.32l8.2-5.7A.8.8 0 0 1 18 6.3z"/>',
 next:'<path d="M18 5.5v13"/><path d="M6 6.3v11.4a.8.8 0 0 0 1.25.66l8.2-5.7a.8.8 0 0 0 0-1.32l-8.2-5.7A.8.8 0 0 0 6 6.3z"/>',
 shuffle:'<path d="M4 7h2.5c4.5 0 5.6 10 10 10H20"/><path d="M4 17h2.5c1.5 0 2.4-1.5 3.2-3.2M14.3 10.2C15.1 8.5 16 7 17.5 7H20"/><path d="m17.5 4.5 2.5 2.5-2.5 2.5M17.5 14.5l2.5 2.5-2.5 2.5"/>',
 repeat:'<path d="M4 11.5V10a3 3 0 0 1 3-3h11.5"/><path d="m15.5 4 3 3-3 3"/><path d="M20 12.5V14a3 3 0 0 1-3 3H5.5"/><path d="m8.5 20-3-3 3-3"/>',
 repeat1:'<path d="M4 11.5V10a3 3 0 0 1 3-3h11.5"/><path d="m15.5 4 3 3-3 3"/><path d="M20 12.5V14a3 3 0 0 1-3 3H5.5"/><path d="m8.5 20-3-3 3-3"/><path d="m11.4 10.2 1.3-.8v5.6"/>',
 image:'<rect x="3.5" y="4.5" width="17" height="15" rx="4"/><circle cx="9" cy="10" r="1.7"/><path d="m5 17 4.5-4.5a1.2 1.2 0 0 1 1.7 0L17 17"/>',
 music:'<path d="M9.5 17.5V6.2l9.5-2v11.3"/><circle cx="6.8" cy="17.5" r="2.7"/><circle cx="16.3" cy="15.3" r="2.7"/>',
 heart:'<path d="M12 19.2s-7.2-4.3-7.2-9.6A3.9 3.9 0 0 1 12 7.2a3.9 3.9 0 0 1 7.2 2.4c0 5.3-7.2 9.6-7.2 9.6z"/>',
 timer:'<circle cx="12" cy="13.5" r="7"/><path d="M12 10v3.7l2.2 1.3M9.5 3.5h5"/>',
 list:'<path d="M9 6.5h11M9 12h11M9 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/>',
 x:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
 down:'<path d="m6 9 6 6 6-6"/>',
 trash:'<path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2h9.2l.9-12.2"/>'
};
const ic=(n,c='ic')=>`<svg class="${c}" viewBox="0 0 24 24">${I[n]}</svg>`;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const fmt=s=>isFinite(s)&&s>0?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`:'0:00';
const plural=n=>{const d=n%10,h=n%100;return d===1&&h!==11?'трек':(d>1&&d<5&&(h<12||h>14))?'трека':'треков'};
const fill=el=>el.style.setProperty('--p',(el.value-el.min)/(el.max-el.min)*100+'%');

/* --- colors: taken from the chosen picture --- */
let accentCss='hsl(260 60% 78%)';
function setTheme(h,s){
  s=Math.min(Math.max(s,45),85);
  const rs=document.documentElement.style;
  accentCss=`hsl(${h} ${s}% 78%)`;
  rs.setProperty('--accent',accentCss);
  rs.setProperty('--on-accent',`hsl(${h} 40% 12%)`);
  rs.setProperty('--surface',`hsl(${h} 25% 8%)`);
  rs.setProperty('--surface2',`hsl(${h} 22% 15%)`);
  rs.setProperty('--line',`hsl(${h} 20% 24%)`);
}
function rgbToHsl(r,g2,b){
  r/=255;g2/=255;b/=255;
  const mx=Math.max(r,g2,b),mn=Math.min(r,g2,b);
  let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g2-b)/d+(g2<b?6:0
