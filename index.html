<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d10">
<meta name="mobile-web-app-capable" content="yes">
<title>Мой плеер</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--accent:hsl(300 62% 74%);--on-accent:hsl(300 35% 10%);--base:#0d0d10;--surface:#17171b;--line:rgba(255,255,255,.08);--fg:#f2f2f4;--mut:rgba(255,255,255,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--base);color:var(--fg);font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;transition:background .8s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
#bg{position:fixed;inset:0;background:50%/cover no-repeat;filter:blur(70px) saturate(.8) brightness(.22);transform:scale(1.2);opacity:0;transition:opacity 1s;z-index:0}
#bg.on{opacity:1}
.app{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 24px calc(18px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--fg);transition:background .3s,transform .2s,color .3s}
.iconbtn:active{transform:scale(.92);background:rgba(255,255,255,.06)}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.head{text-align:center}
.head h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px}
.head small{display:block;margin-top:2px;font-size:12px;color:var(--mut);font-weight:500}
.tabs{display:flex;justify-content:center;gap:28px;margin-top:18px;border-bottom:1px solid var(--line)}
.tab{position:relative;padding:0 0 12px;font-size:14px;font-weight:500;color:var(--mut);transition:color .3s}
.tab.on{color:var(--fg)}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.stage{position:relative;flex:1;min-height:0;margin-top:22px;border-radius:24px;background:var(--surface);overflow:hidden;cursor:pointer}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.view canvas{position:absolute;inset:0;width:100%;height:100%}
.lyrics{position:absolute;inset:0;width:100%;height:100%;border:0;outline:none;resize:none;background:transparent;color:var(--fg);padding:28px 26px;font:inherit;font-size:17px;line-height:1.7;font-weight:400;cursor:text;user-select:text;-webkit-user-select:text}
.lyrics::placeholder{color:var(--mut)}
.lyrics:disabled{opacity:.4}
.meta{margin-top:24px}
.title{font-size:22px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{margin-top:4px;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{margin-top:20px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;margin:0;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent)) 0/var(--p,0%) 100% no-repeat,rgba(255,255,255,.14)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;border-radius:50%;background:var(--fg);border:0}
input[type=range]::-moz-range-track{height:2px;background:rgba(255,255,255,.14)}
input[type=range]::-moz-range-progress{height:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--fg)}
.times{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:center;justify-content:space-between;margin:18px 0 24px}
.ctrl .iconbtn{width:48px;height:48px;border-radius:50%}
.ctrl .iconbtn svg{width:24px;height:24px}
.ctrl .iconbtn.on{color:var(--accent)}
.play{width:72px;height:72px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--accent);color:var(--on-accent);cursor:pointer;transition:transform .2s}
.play:active{transform:scale(.94)}
.play svg{width:26px;height:26px;fill:currentColor;stroke:none}
.play .i-play{margin-left:3px}
.play .i-pause{display:none}
.play.playing .i-play{display:none}
.play.playing .i-pause{display:block}
.row2{display:flex;align-items:center;gap:14px}
.chip{height:36px;min-width:44px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;font-variant-numeric:tabular-nums;transition:color .3s,background .3s}
.chip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.chip:active{background:rgba(255,255,255,.06)}
.chip.on{color:var(--accent)}
.vol{flex:1;min-width:0}
.r1{display:none}
#rep.one .r1{display:block}
#rep.one .r0{display:none}
#fav.on{color:var(--accent)}
#fav.on svg{fill:currentColor}
.dim{position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:480px;margin:0 auto;height:70vh;display:flex;flex-direction:column;padding:20px 24px calc(16px + env(safe-area-inset-bottom));background:var(--base);border-top:1px solid var(--line);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh b{font-size:16px;font-weight:600}
.sh div{display:flex;gap:2px}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:14px;min-height:56px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.it.cur{color:var(--accent)}
.n{width:22px;flex:none;text-align:center;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.it.cur .n{color:var(--accent)}
.nm{flex:1;min-width:0;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fvi{width:14px;height:14px;fill:currentColor;flex:none;color:var(--accent)}
.rm{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:10px;color:var(--mut)}
.rm svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.hint{margin:40px 0;text-align:center;font-size:14px;line-height:1.6;color:var(--mut)}
#toast{position:fixed;z-index:9;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-180%);padding:10px 18px;border-radius:999px;background:var(--fg);color:var(--base);font-size:13px;font-weight:600;white-space:nowrap;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
#toast.show{transform:translate(-50%,0)}
#err{position:fixed;left:8px;right:8px;bottom:4px;z-index:20;display:none;font-size:12px;color:#ffb4b4;background:#000;padding:6px 8px;border-radius:8px}
</style>
</head>
<body>
<div id="bg"></div>

<div class="app">
  <div class="top">
    <button class="iconbtn" id="add" aria-label="Добавить музыку"><svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
    <div class="head"><h1>Мой плеер</h1><small id="count">Пусто</small></div>
    <button class="iconbtn" id="pic" aria-label="Выбрать картинку"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="4"/><circle cx="9" cy="10" r="1.7"/><path d="m5 17 4.5-4.5a1.2 1.2 0 0 1 1.7 0L17 17"/></svg></button>
  </div>

  <div class="tabs">
    <button class="tab" data-v="scene">Шаблон</button>
    <button class="tab" data-v="ring">Визуализация</button>
    <button class="tab" data-v="text">Текст</button>
  </div>

  <div class="stage" id="stage">
    <div class="view" data-v="scene"><canvas id="scene"></canvas></div>
    <div class="view" data-v="ring"><canvas id="ring"></canvas></div>
    <div class="view" data-v="text"><textarea class="lyrics" id="lyrics" placeholder="Сначала выберите трек"></textarea></div>
  </div>

  <div class="meta">
    <div class="title" id="title">Выберите трек</div>
    <div class="artist" id="artist">Нажмите + и выберите музыку</div>
  </div>

  <div class="seek">
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>

  <div class="ctrl">
    <button class="iconbtn" id="shf" aria-label="Перемешать"><svg viewBox="0 0 24 24"><path d="M4 7h2.5c4.5 0 5.6 10 10 10H20"/><path d="M4 17h2.5c1.5 0 2.4-1.5 3.2-3.2M14.3 10.2C15.1 8.5 16 7 17.5 7H20"/><path d="m17.5 4.5 2.5 2.5-2.5 2.5M17.5 14.5l2.5 2.5-2.5 2.5"/></svg></button>
    <button class="iconbtn" id="prev" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M6 5.5v13"/><path d="M18 6.3v11.4a.8.8 0 0 1-1.25.66l-8.2-5.7a.8.8 0 0 1 0-1.32l8.2-5.7A.8.8 0 0 1 18 6.3z"/></svg></button>
    <button class="play" id="play" aria-label="Играть"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
    <button class="iconbtn" id="next" aria-label="Далее"><svg viewBox="0 0 24 24"><path d="M18 5.5v13"/><path d="M6 6.3v11.4a.8.8 0 0 0 1.25.66l8.2-5.7a.8.8 0 0 0 0-1.32l-8.2-5.7A.8.8 0 0 0 6 6.3z"/></svg></button>
    <button class="iconbtn" id="rep" aria-label="Повтор"><svg class="r0" viewBox="0 0 24 24"><path d="M4 11.5V10a3 3 0 0 1 3-3h11.5"/><path d="m15.5 4 3 3-3 3"/><path d="M20 12.5V14a3 3 0 0 1-3 3H5.5"/><path d="m8.5 20-3-3 3-3"/></svg><svg class="r1" viewBox="0 0 24 24"><path d="M4 11.5V10a3 3 0 0 1 3-3h11.5"/><path d="m15.5 4 3 3-3 3"/><path d="M20 12.5V14a3 3 0 0 1-3 3H5.5"/><path d="m8.5 20-3-3 3-3"/><path d="m11.4 10.2 1.3-.8v5.6"/></svg></button>
  </div>

  <div class="row2">
    <button class="chip" id="spd">1×</button>
    <button class="chip" id="tmr" aria-label="Таймер сна"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M12 10v3.7l2.2 1.3M9.5 3.5h5"/></svg><span id="tmrt"></span></button>
    <input type="range" class="vol" id="vol" min="0" max="100" value="80" aria-label="Громкость">
    <button class="iconbtn" id="fav" aria-label="Избранное"><svg viewBox="0 0 24 24"><path d="M12 19.2s-7.2-4.3-7.2-9.6A3.9 3.9 0 0 1 12 7.2a3.9 3.9 0 0 1 7.2 2.4c0 5.3-7.2 9.6-7.2 9.6z"/></svg></button>
    <button class="iconbtn" id="lst" aria-label="Плейлист"><svg viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/></svg></button>
  </div>
</div>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet">
  <div class="sh"><b>Плейлист</b>
    <div>
      <button class="iconbtn" id="clr" aria-label="Очистить"><svg viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2h9.2l.9-12.2"/></svg></button>
      <button class="iconbtn" id="close" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
  </div>
  <div id="list"></div>
</div>

<input type="file" id="file" accept="audio/*" multiple hidden>
<input type="file" id="imgf" accept="image/*" hidden>
<div id="toast"></div>
<div id="err"></div>
<script>window.onerror=function(m){var e=document.getElementById('err');if(e){e.textContent='Ошибка: '+m;e.style.display='block'}};</script>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const SP=[1,1.25,1.5,2,.75], TM=[0,15,30,60];
const ICON_X='<svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const fmt=s=>isFinite(s)&&s>0?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`:'0:00';
const plural=n=>{const d=n%10,h=n%100;return d===1&&h!==11?'трек':(d>1&&d<5&&(h<12||h>14))?'трека':'треков'};
const fill=el=>el.style.setProperty('--p',(el.value-el.min)/(el.max-el.min)*100+'%');
function rgbToHsl(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
  let h=0,s=0;
  if(mx!==mn){
    const d=mx-mn;
    s=l>.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=(g-b)/d+(g<b?6:0);
    else if(mx===g)h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60;
  }
  return [h,s*100,l*100];
}

/* ---------- colours: one muted accent taken from the picture ---------- */
let ph=300;
function hsl(dh,s,l,a){return `hsla(${((ph+dh)%360+360)%360},${s}%,${l}%,${a===undefined?1:a})`}
function setPalette(h){
  ph=Math.round(h);
  const rs=document.documentElement.style;
  rs.setProperty('--accent',hsl(0,62,74,1));
  rs.setProperty('--on-accent',hsl(0,35,10,1));
  rs.setProperty('--base',hsl(0,14,6,1));
  rs.setProperty('--surface',hsl(0,12,10,1));
}
function paletteFrom(url){
  const im=new Image();
  im.onload=()=>{
    const c=document.createElement('canvas');c.width=c.height=40;
    const x=c.getContext('2d');
    x.drawImage(im,0,0,40,40);
    const d=x.getImageData(0,0,40,40).data;
    let ax=0,ay=0,w=0;
    for(let i=0;i<d.length;i+=4){
      const hs=rgbToHsl(d[i],d[i+1],d[i+2]);
      if(hs[1]>25&&hs[2]>18&&hs[2]<85){
        const k=hs[1]/100,rad=hs[0]*Math.PI/180;
        ax+=Math.cos(rad)*k;ay+=Math.sin(rad)*k;w+=k;
      }
    }
    if(w<5){setPalette(300);return}
    let h=Math.atan2(ay,ax)*180/Math.PI;
    if(h<0)h+=360;
    setPalette(h);
  };
  im.src=url;
}

/* ---------- state ---------- */
let st={};
try{st=JSON.parse(localStorage.getItem('mplayer'))||{}}catch(e){}
let tracks=[],cur=-1,rep=st.rep||0,shf=!!st.shf,spi=st.spi||0,tmi=0,tmId=0,coverUrl='',sx=null,drag=false,actx=null,an=null,view=st.view||'ring',sceneImg=null,bass=0,mid=0,tt=0,parts=[];
const dd=new Uint8Array(128);
const audio=new Audio();
audio.preload='metadata';
audio.volume=(st.vol??80)/100;
const save=()=>{try{localStorage.setItem('mplayer',JSON.stringify({rep,shf,spi,view,vol:Math.round(audio.volume*100)}))}catch(e){}};

/* ---------- UI helpers ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function toggleSheet(on){$('#sheet').classList.toggle('open',on);$('#dim').classList.toggle('on',on)}
function setView(v){
  view=v;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  save();
}

const lyr=$('#lyrics');
function loadLyrics(){
  const t=tracks[cur];
  lyr.disabled=!t;
  let txt='';
  if(t){try{txt=localStorage.getItem('lyr:'+t.name)||''}catch(e){}}
  lyr.value=txt;
}

function render(){
  const t=tracks[cur],n=tracks.length;
  $('#count').textContent=n?`${n} ${plural(n)}`:'Пусто';
  $('#title').textContent=t?t.name:'Выберите трек';
  $('#artist').textContent=t?`Трек ${cur+1} из ${n}`:'Нажмите + и выберите музыку';
  $('#bg').classList.toggle('on',!!coverUrl);
  $('#play').classList.toggle('playing',!audio.paused);
  $('#play').setAttribute('aria-label',audio.paused?'Играть':'Пауза');
  $('#rep').classList.toggle('one',rep===2);
  $('#rep').classList.toggle('on',rep>0);
  $('#shf').classList.toggle('on',shf);
  $('#spd').textContent=SP[spi]+'×';
  $('#spd').classList.toggle('on',spi>0);
  $('#tmrt').textContent=TM[tmi]?TM[tmi]+' мин':'';
  $('#tmr').classList.toggle('on',TM[tmi]>0);
  $('#fav').classList.toggle('on',!!(t&&t.fav));
  renderList();
}

function renderList(){
  const L=$('#list');
  if(!tracks.length){L.innerHTML='<div class="hint">Список пуст.<br>Нажмите + вверху и выберите музыку с телефона.</div>';return}
  L.innerHTML=tracks.map((t,i)=>`<div class="it${i===cur?' cur':''}" data-k="${i}"><span class="n">${i===cur&&!audio.paused?'♪':i+1}</span><span class="nm">${esc(t.name)}</span>${t.fav?'<svg class="fvi" viewBox="0 0 24 24"><path d="M12 19.2s-7.2-4.3-7.2-9.6A3.9 3.9 0 0 1 12 7.2a3.9 3.9 0 0 1 7.2 2.4c0 5.3-7.2 9.6-7.2 9.6z"/></svg>':''}<button class="rm" aria-label="Удалить">${ICON_X}</button></div>`).join('');
}

/* ---------- playback ---------- */
function setupAudio(){
  try{
    if(!actx){
      actx=new(window.AudioContext||window.webkitAudioContext)();
      const src=actx.createMediaElementSource(audio);
      an=actx.createAnalyser();an.fftSize=256;
      src.connect(an);an.connect(actx.destination);
    }
    if(actx.state==='suspended')actx.resume();
  }catch(e){}
}
function select(i){
  if(i<0||i>=tracks.length)return;
  cur=i;
  audio.src=tracks[i].url;
  loadLyrics();
  mediaInfo();
  playNow();
}
function playNow(){
  if(cur<0){if(tracks.length)select(0);return}
  setupAudio();
  audio.playbackRate=SP[spi];
  audio.play().catch(err=>{if(err.name!=='AbortError')toast('Не получилось включить трек')});
  render();
}
function toggle(){audio.paused?playNow():audio.pause()}
function next(){
  if(!tracks.length)return;
  if(shf&&tracks.length>1){let n;do n=Math.floor(Math.random()*tracks.length);while(n===cur);return select(n)}
  if(cur+1<tracks.length)return select(cur+1);
  if(rep)return select(0);
  audio.pause();audio.currentTime=0;render();
}
function prev(){
  if(!tracks.length)return;
  if(audio.currentTime>3){audio.currentTime=0;return}
  select(cur>0?cur-1:(rep?tracks.length-1:0));
}
function removeAt(i){
  const t=tracks[i];
  if(i===cur){audio.pause();audio.removeAttribute('src');audio.load();cur=-1}
  else if(i<cur)cur--;
  tracks.splice(i,1);
  URL.revokeObjectURL(t.url);
  loadLyrics();
  render();
}
function mediaInfo(){
  const ms=navigator.mediaSession,t=tracks[cur];
  if(!ms||!t)return;
  try{ms.metadata=new MediaMetadata({title:t.name,artist:'Мой плеер',album:'Мой плеер',artwork:coverUrl?[{src:coverUrl,sizes:'512x512'}]:[]})}catch(e){}
}

audio.onplay=()=>{render();if(navigator.mediaSession)navigator.mediaSession.playbackState='playing'};
audio.onpause=()=>{render();if(navigator.mediaSession)navigator.mediaSession.playbackState='paused'};
audio.onended=()=>{if(rep===2){audio.currentTime=0;playNow()}else next()};
audio.onerror=()=>{if(audio.getAttribute('src'))toast('Этот файл не открывается')};
audio.ontimeupdate=()=>{
  const d=audio.duration,s=$('#seek');
  if(!drag){s.value=d?audio.currentTime/d*1000:0;fill(s)}
  $('#cur').textContent=fmt(audio.currentTime);
  $('#dur').textContent=fmt(d);
};

/* ---------- drawing: Шаблон ---------- */
const sc=$('#scene'),sg=sc.getContext('2d');
const rc=$('#ring'),rg=rc.getContext('2d');
function sizeCanvas(c){
  const dpr=Math.min(window.devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}
  return{dpr,w,h};
}
function animeScene(W,H){
  sg.fillStyle=hsl(0,50,12,1);sg.fillRect(0,0,W,H);
  const wx=W*.5,wy=H*.1,ww=W*.42,wh=H*.56;
  let gr=sg.createLinearGradient(0,wy,0,wy+wh);
  gr.addColorStop(0,hsl(30,70,26,1));gr.addColorStop(.55,hsl(0,70,56,1));gr.addColorStop(1,hsl(40,80,70,1));
  sg.fillStyle=gr;sg.fillRect(wx,wy,ww,wh);
  const sx2=wx+ww*.7,sy2=wy+wh*.55;
  gr=sg.createRadialGradient(sx2,sy2,2,sx2,sy2,ww*.5);
  gr.addColorStop(0,`rgba(255,250,220,${.6+bass*.3})`);gr.addColorStop(1,'rgba(255,220,160,0)');
  sg.fillStyle=gr;sg.fillRect(wx,wy,ww,wh);
  const bld=[[.02,.35],[.12,.22],[.2,.42],[.31,.28],[.42,.5],[.55,.3],[.66,.4],[.78,.25],[.9,.36]];
  sg.fillStyle=hsl(-30,40,20,1);
  bld.forEach(([x,hh])=>sg.fillRect(wx+ww*x,wy+wh-wh*hh,ww*.08,wh*hh));
  sg.fillStyle='#ffe9a8';
  bld.forEach(([x,hh],i)=>{if(Math.sin(tt*2.5+i*1.7)>.2)sg.fillRect(wx+ww*x+ww*.02,wy+wh-wh*hh+wh*.06,ww*.02,wh*.03)});
  sg.strokeStyle=hsl(0,40,12,1);sg.lineWidth=Math.max(2,W*.008);
  sg.strokeRect(wx,wy,ww,wh);
  sg.beginPath();sg.moveTo(wx+ww/2,wy);sg.lineTo(wx+ww/2,wy+wh);sg.moveTo(wx,wy+wh*.5);sg.lineTo(wx+ww,wy+wh*.5);sg.stroke();
  sg.fillStyle=hsl(-10,40,10,1);sg.fillRect(0,H*.8,W,H*.2);
  const lx=W*.2,ly=H*.6;
  gr=sg.createRadialGradient(lx,ly,2,lx,ly,W*.2);
  gr.addColorStop(0,`rgba(255,200,130,${.35+mid*.4})`);gr.addColorStop(1,'rgba(255,200,130,0)');
  sg.fillStyle=gr;sg.fillRect(0,0,W,H);
  const cx=W*.32,by=H*.8;
  sg.fillStyle=hsl(0,40,5,1);
  sg.beginPath();sg.ellipse(cx,H*.42,W*.055,H*.13,0,0,Math.PI*2);sg.fill();
  sg.beginPath();sg.moveTo(cx-W*.06,by);sg.quadraticCurveTo(cx-W*.065,H*.62,cx-W*.035,H*.52);sg.lineTo(cx+W*.035,H*.52);sg.quadraticCurveTo(cx+W*.065,H*.62,cx+W*.06,by);sg.closePath();sg.fill();
  sg.beginPath();sg.arc(cx,H*.42,H*.09,0,Math.PI*2);sg.fill();
  sg.beginPath();sg.ellipse(cx-H*.02,H*.37,H*.09,H*.045,-.3,Math.PI,Math.PI*2);sg.fill();
  sg.strokeStyle=hsl(20,80,80,1);sg.lineWidth=2;
  sg.beginPath();sg.arc(cx,H*.41,H*.1,Math.PI*1.12,Math.PI*1.88);sg.stroke();
  sg.fillStyle=hsl(20,80,80,1);
  sg.beginPath();sg.arc(cx-H*.088,H*.41,H*.03,0,Math.PI*2);sg.fill();
  sg.beginPath();sg.arc(cx+H*.088,H*.41,H*.03,0,Math.PI*2);sg.fill();
}
function sparkles(W,H){
  const e=bass*.6+mid*.4;
  if(Math.random()<.03+e*.2&&parts.length<30){
    const cols=['#ffffff',hsl(0,80,88,1),hsl(40,80,86,1)];
    parts.push({x:Math.random()*W,y:Math.random()*H*.9,life:1,r:2.5+Math.random()*3,ph2:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]});
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life-=.012+e*.02;
    if(p.life<=0){parts.splice(i,1);continue}
    const a=Math.max(0,p.life*(.5+.5*Math.sin(tt*4+p.ph2)));
    const r=p.r*(.8+e*.6);
    sg.save();
    sg.globalAlpha=a;sg.strokeStyle=p.c;sg.fillStyle=p.c;sg.lineWidth=1.2;
    sg.beginPath();sg.moveTo(p.x-r,p.y);sg.lineTo(p.x+r,p.y);sg.moveTo(p.x,p.y-r);sg.lineTo(p.x,p.y+r);sg.stroke();
    sg.beginPath();sg.arc(p.x,p.y,r*.3,0,Math.PI*2);sg.fill();
    sg.restore();
  }
}
function drawScene(W,H){
  sg.clearRect(0,0,W,H);
  if(sceneImg&&sceneImg.complete&&sceneImg.naturalWidth){
    const s=Math.max(W/sceneImg.naturalWidth,H/sceneImg.naturalHeight);
    const iw=sceneImg.naturalWidth*s,ih=sceneImg.naturalHeight*s;
    sg.drawImage(sceneImg,(W-iw)/2,(H-ih)/2,iw,ih);
    sg.fillStyle=`rgba(10,6,12,${.25-bass*.1})`;sg.fillRect(0,0,W,H);
  } else animeScene(W,H);
  sparkles(W,H);
}

/* ---------- drawing: Визуализация (thin ring) ---------- */
function drawRing(W,H){
  const cx=W/2,cy=H/2,R=Math.min(W,H)*.11;
  rg.clearRect(0,0,W,H);
  rg.lineCap='round';
  const n=72;
  for(let i=0;i<n;i++){
    const idx=1+Math.floor(Math.pow(i/n,1.6)*90);
    const raw=dd[idx]/255;
    const idle=.08+.05*Math.sin(tt*1.6+i*.35);
    const v=Math.max(raw,idle);
    const ang=i/n*Math.PI*2-Math.PI/2;
    const r1=R*1.7,r2=r1+R*.15+v*R*.8;
    rg.strokeStyle=`rgba(255,255,255,${.18+v*.72})`;
    rg.lineWidth=Math.max(1.5,R*.035);
    rg.beginPath();
    rg.moveTo(cx+Math.cos(ang)*r1,cy+Math.sin(ang)*r1);
    rg.lineTo(cx+Math.cos(ang)*r2,cy+Math.sin(ang)*r2);
    rg.stroke();
  }
  const cr=R*(1+bass*.06);
  rg.save();
  rg.beginPath();rg.arc(cx,cy,cr,0,Math.PI*2);rg.clip();
  if(sceneImg&&sceneImg.complete&&sceneImg.naturalWidth){
    const s=Math.max(2*cr/sceneImg.naturalWidth,2*cr/sceneImg.naturalHeight);
    const iw=sceneImg.naturalWidth*s,ih=sceneImg.naturalHeight*s;
    rg.drawImage(sceneImg,cx-iw/2,cy-ih/2,iw,ih);
  } else {
    rg.fillStyle=hsl(0,62,74,1);
    rg.fillRect(cx-cr,cy-cr,cr*2,cr*2);
  }
  rg.restore();
}

/* ---------- main loop ---------- */
function loop(){
  requestAnimationFrame(loop);
  try{
    tt+=1/60;
    if(an)an.getByteFrequencyData(dd);
    const avg=(a,z)=>{let s=0;for(let i=a;i<z;i++)s+=dd[i];return s/(z-a)/255};
    bass+=(avg(0,4)-bass)*.3;
    mid+=(avg(8,24)-mid)*.25;
    if(view==='scene'){const q=sizeCanvas(sc);sg.setTransform(q.dpr,0,0,q.dpr,0,0);drawScene(q.w,q.h)}
    else if(view==='ring'){const q=sizeCanvas(rc);rg.setTransform(q.dpr,0,0,q.dpr,0,0);drawRing(q.w,q.h)}
  }catch(e){
    const el=document.getElementById('err');
    if(el){el.textContent='Ошибка рисунка: '+e.message;el.style.display='block'}
  }
}

/* ---------- buttons and gestures ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.v));
lyr.oninput=()=>{const t=tracks[cur];if(!t)return;try{localStorage.setItem('lyr:'+t.name,lyr.value)}catch(e){}};

$('#play').onclick=toggle;
$('#next').onclick=next;
$('#prev').onclick=prev;
$('#shf').onclick=()=>{shf=!shf;save();render()};
$('#rep').onclick=()=>{rep=(rep+1)%3;save();render()};
$('#spd').onclick=()=>{spi=(spi+1)%SP.length;audio.playbackRate=SP[spi];save();render()};
$('#tmr').onclick=()=>{
  tmi=(tmi+1)%TM.length;clearTimeout(tmId);
  if(TM[tmi])tmId=setTimeout(()=>{audio.pause();tmi=0;render();toast('Таймер сна: музыка выключена')},TM[tmi]*6e4);
  render();
};
$('#fav').onclick=()=>{const t=tracks[cur];if(t){t.fav=!t.fav;render()}};
$('#add').onclick=()=>$('#file').click();
$('#pic').onclick=()=>$('#imgf').click();
$('#lst').onclick=()=>toggleSheet(true);
$('#close').onclick=$('#dim').onclick=()=>toggleSheet(false);
$('#clr').onclick=()=>{
  if(!tracks.length||!confirm('Очистить весь плейлист?'))return;
  audio.pause();audio.removeAttribute('src');audio.load();
  tracks.forEach(t=>URL.revokeObjectURL(t.url));
  tracks=[];cur=-1;loadLyrics();render();
};

const seek=$('#seek');
seek.oninput=()=>{fill(seek);if(audio.duration)audio.currentTime=seek.value/1000*audio.duration};
seek.onpointerdown=()=>{drag=true};
addEventListener('pointerup',()=>{drag=false});

const vol=$('#vol');
vol.value=Math.round(audio.volume*100);fill(vol);
vol.oninput=()=>{audio.volume=vol.value/100;fill(vol);save()};

$('#list').onclick=e=>{
  const it=e.target.closest('.it');if(!it)return;
  const k=+it.dataset.k;
  if(e.target.closest('.rm'))removeAt(k);
  else{select(k);toggleSheet(false)}
};

$('#file').onchange=e=>{
  const files=[...e.target.files];e.target.value='';
  if(!files.length)return;
  const first=tracks.length;
  files.forEach(f=>tracks.push({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f),fav:false}));
  toast(`Добавлено: ${files.length}`);
  if(cur<0)select(first);else render();
};
$('#imgf').onchange=e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  if(coverUrl)URL.revokeObjectURL(coverUrl);
  coverUrl=URL.createObjectURL(f);
  $('#bg').style.backgroundImage=`url("${coverUrl}")`;
  sceneImg=new Image();sceneImg.src=coverUrl;
  paletteFrom(coverUrl);
  mediaInfo();render();
};

const stage=$('#stage');
stage.onclick=e=>{
  if(e.target.closest('textarea'))return;
  if(!tracks.length){$('#file').click();return}
  toggle();
};
stage.addEventListener('touchstart',e=>{sx=e.target.closest('textarea')?null:e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{
  if(sx===null)return;
  const dx=e.changedTouches[0].clientX-sx;
  sx=null;
  if(tracks.length&&Math.abs(dx)>60){dx<0?next():prev()}
});

if(navigator.mediaSession){
  const H={play:()=>playNow(),pause:()=>audio.pause(),previoustrack:()=>prev(),nexttrack:()=>next(),seekto:d=>{if(d.seekTime!=null)audio.currentTime=d.seekTime}};
  for(const k in H){try{navigator.mediaSession.setActionHandler(k,H[k])}catch(e){}}
}

/* ---------- start ---------- */
setPalette(300);
setView(view);
loadLyrics();
render();
loop();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
